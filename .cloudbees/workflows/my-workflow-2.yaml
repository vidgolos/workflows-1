apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: rerun-different-jobs-chain

on:
  workflow_dispatch:

jobs:
  root:
    steps:
      - name: run
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "root on attempt ${{ cloudbees.run_attempt }}"

  left:
    needs: [root]
    steps:
      - name: run
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "left on attempt ${{ cloudbees.run_attempt }}"

  right:
    needs: [root]
    steps:
      - name: run
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "right on attempt ${{ cloudbees.run_attempt }}"
